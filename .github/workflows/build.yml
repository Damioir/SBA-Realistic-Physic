name: Build SBA Costume Map Maker

on:
  workflow_dispatch:
  push:
    branches: [main, costume-map-editor]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build Android library
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package for SBAModLoader
        run: python3 tools/package.py

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: SBA-Costume-Map-Maker
          path: |
            dist/SBA-Costume-Map-Maker.sbapack
            build/libsba_physics.so
