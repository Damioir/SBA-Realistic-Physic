name: Build SBA Costume Map Maker

on:
  workflow_dispatch:
  push:
    branches: [main, costume-map-editor]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Prepare pinned minimal Dobby
        run: |
          git clone --no-checkout https://github.com/jmpews/Dobby.git third_party/dobby-upstream
          git -C third_party/dobby-upstream checkout ed69ebebc762b05c1bbce005f3d470cdb22602b8
          python3 tools/prepare_dobby.py third_party/dobby-upstream third_party/dobby-mini

      - name: Build Android library
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Compile editor activity
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/stubs build/classes build/dex
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" \
            -d build/stubs android/stubs/com/unity3d/player/UnityPlayerActivity.java
          javac -source 8 -target 8 -classpath "$ANDROID_JAR:build/stubs" \
            -d build/classes android/src/dev/damioir/sbacostumemap/CostumeMapActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 24 --lib "$ANDROID_JAR" \
            --output build/dex build/classes/dev/damioir/sbacostumemap/CostumeMapActivity*.class

      - name: Package for SBAModLoader
        run: python3 tools/package.py --dex build/dex/classes.dex

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: SBA-Costume-Map-Maker
          path: |
            dist/SBA-Costume-Map-Maker.sbapack
            build/libsba_physics.so
